name: Make message audio
# When messages.json changes, record any new messages in the natural voices (English and Spanish) and save them to audio/.
on:
  push:
    paths: ["messages.json", "tools/make_audio.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install voice engine
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q kokoro-onnx soundfile
          mkdir -p /tmp/tts
          curl -sSL -o /tmp/tts/model.onnx https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/onnx/model.onnx
          curl -sSL -o /tmp/tts/af_heart.bin https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/af_heart.bin
          curl -sSL -o /tmp/tts/ef_dora.bin https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/ef_dora.bin
      - name: Make audio
        run: python tools/make_audio.py /tmp/tts
      - name: Save audio
        run: |
          git config user.name "klarity-bot"
          git config user.email "klarity-bot@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || (git commit -m "Add audio for new messages" && git push)
