<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klarity Daily Strength</title>
<meta name="description" content="A short daily message of strength and belonging.">
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Klarity">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
/* Klarity: black ground, gold light, silver horizon. One dark look, high contrast for low vision. */
:root {
  --bg: #0A0A0A;
  --surface: #151515;
  --fg: #F4F1EA;
  --muted: #C0C0C0;
  --gold: #D4AF37;
  --line: #2a2a2a;
  --focus: #F2D675;
  --brand: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
  --scale: 1;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { font-size: calc(100% * var(--scale)); -webkit-text-size-adjust: 100%; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 1.125rem; line-height: 1.55;
  padding-top: max(24px, env(safe-area-inset-top, 0px));
  padding-bottom: max(40px, env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
}
.wrap { max-width: 40rem; margin: 0 auto; display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
main > *, .wrap > * { min-width: 0; max-width: 100%; overflow-wrap: break-word; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; min-width: 0; }
.wordmark { font-family: var(--brand); font-weight: 600; font-size: 1.9rem; letter-spacing: 0.14em; color: var(--gold); text-transform: uppercase; }
.sub { font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
button {
  font: inherit; font-weight: 600; font-size: 0.95rem; min-height: 48px; padding: 0 18px;
  border-radius: 999px; border: 2px solid var(--muted); background: transparent; color: var(--fg); cursor: pointer;
}
button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #0A0A0A; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.horizon { display: grid; justify-items: center; gap: 0; padding-top: 8px; }
.size { min-width: 56px; padding: 0 14px; font-size: 1.1rem; }
.size:disabled { opacity: 0.4; cursor: default; }
.sun { width: 120px; height: 60px; border-radius: 120px 120px 0 0; background: var(--gold); }
.line { width: min(320px, 80%); height: 3px; background: var(--muted); margin-top: 10px; }
main { grid-template-columns: minmax(0, 1fr); display: grid; gap: 14px; text-align: center; justify-items: center; }
.date { font-size: 0.9rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
h1 { font-family: var(--brand); font-weight: 600; font-size: min(3rem, 15vw); line-height: 1.05; margin: 0; text-wrap: balance; }
.message { font-size: 1.45rem; width: 100%; max-width: min(32ch, 100%); line-height: 1.6; margin: 0; max-width: 32ch; text-wrap: pretty; }
.try { width: 100%; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 16px; padding: 18px 20px; display: grid; gap: 6px; text-align: left; }
.try-label { font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.try p { margin: 0; font-size: 1.15rem; font-weight: 600; }
details { border-top: 1px solid var(--line); padding-top: 18px; }
summary { cursor: pointer; font-weight: 600; min-height: 44px; display: flex; align-items: center; color: var(--muted); }
.past { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 18px; }
.past li { display: grid; gap: 4px; }
.pd { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
.pf { font-weight: 800; }
.past p { margin: 0; color: var(--muted); }
.install { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; color: var(--muted); font-size: 0.95rem; }
.install strong { color: var(--fg); font-weight: 600; }
footer { color: var(--muted); font-size: 0.9rem; text-align: center; }
@media (prefers-reduced-motion: no-preference) {
  .sun { animation: rise 1.4s ease-out both; }
  @keyframes rise { from { transform: translateY(14px); opacity: 0.3; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="wordmark">Klarity</span><span class="sub">Daily Strength</span></div>
    <div class="tools">
      <button id="lang" type="button" lang="es">Español</button>
      <button id="read" type="button" hidden>Read it to me</button>
      <button id="smaller" class="size" type="button" aria-label="Smaller text">A&minus;</button>
      <button id="bigger" class="size" type="button" aria-label="Bigger text">A+</button>
    </div>
  </header>

  <div class="horizon" aria-hidden="true"><div class="sun"></div><div class="line"></div></div>

  <main aria-live="polite">
    <div class="date" id="date"></div>
    <h1 id="focus">Today</h1>
    <p class="message" id="message">Loading today's message.</p>
    <div class="try" id="tryBox" hidden>
      <span class="try-label" id="tryLabel">Try this today</span>
      <p id="practice"></p>
    </div>
  </main>

  <details id="pastWrap" hidden>
    <summary id="pastLabel">Earlier messages</summary>
    <ul class="past" id="past"></ul>
  </details>

  <div class="install" id="install" hidden>
    <strong>Put Klarity on your phone.</strong>
    <span id="installText"></span>
  </div>

</div>

<script>
(function () {
  var el = function (id) { return document.getElementById(id); };
  var current = null, all = null;

  // English or Mexican Spanish, remembered on this phone
  var lang = "en";
  try { if (localStorage.getItem("klarity-lang") === "es") lang = "es"; } catch (e) {}
  var WORDS = {
    en: { tryLabel: "Try this today", past: "Earlier messages", read: "Read it to me", stop: "Stop reading", other: "Español", otherLang: "es",
          none: "Today's message is on its way. Check back soon.", fail: "Can't load today's message. Check your connection and try again.",
          ios: " Tap the Share button, then tap Add to Home Screen.", android: " Tap the menu (three dots), then tap Add to Home screen or Install app.",
          install: "Put Klarity on your phone.", locale: "en-US", speech: "en-US" },
    es: { tryLabel: "Haz esto hoy", past: "Mensajes anteriores", read: "Léemelo", stop: "Dejar de leer", other: "English", otherLang: "en",
          none: "El mensaje de hoy viene en camino. Vuelve a revisar pronto.", fail: "No se pudo cargar el mensaje de hoy. Revisa tu conexión e intenta otra vez.",
          ios: " Toca el botón Compartir y luego toca Agregar a pantalla de inicio.", android: " Toca el menú (tres puntos) y luego toca Agregar a la pantalla principal o Instalar app.",
          install: "Pon Klarity en tu teléfono.", locale: "es-MX", speech: "es-MX" }
  };
  function W() { return WORDS[lang]; }
  function txt(m) { return lang === "es" && m.es ? m.es : m; }

  function localISO(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function pretty(iso) {
    var p = iso.split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString(W().locale, { weekday: "long", month: "long", day: "numeric" });
  }

  function render(list0) {
    all = list0;
    all.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    var today = localISO(new Date());
    var upTo = all.filter(function (m) { return m.date <= today; });
    current = upTo.length ? upTo[upTo.length - 1] : all[0];
    if (!current) { el("message").textContent = W().none; return; }
    // Never run dry: if no message was written for today, bring back an earlier one, a different one each day
    if (current.date < today && upTo.length) {
      var p = today.split("-"), dayNum = Math.floor(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
      current = upTo[dayNum % upTo.length];
    }
    el("date").textContent = pretty(today < current.date ? current.date : today);
    var c = txt(current);
    el("focus").textContent = c.focus;
    el("message").textContent = c.message;
    el("practice").textContent = c.practice || "";
    el("tryBox").hidden = !current.practice;
    var past = upTo.filter(function (m) { return m.date < today && m !== current; }).reverse().slice(0, 7);
    var list = el("past"); list.textContent = "";
    past.forEach(function (m) {
      var li = document.createElement("li");
      var d = document.createElement("span"); d.className = "pd"; d.textContent = pretty(m.date);
      var f = document.createElement("span"); f.className = "pf"; f.textContent = txt(m).focus;
      var p = document.createElement("p"); p.textContent = txt(m).message;
      li.append(d, f, p); list.appendChild(li);
    });
    el("pastWrap").hidden = past.length === 0;
    el("read").hidden = false;
  }

  // Load messages, and check again whenever the app is opened so a new day shows the new message
  var shownDay = null;
  function load() {
    fetch("messages.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (all) { shownDay = localISO(new Date()); render(all); })
      .catch(function () { if (!current) el("message").textContent = W().fail; });
  }
  load();
  function maybeReload() { if (document.visibilityState === "visible") load(); }
  document.addEventListener("visibilitychange", maybeReload);
  window.addEventListener("pageshow", maybeReload);
  window.addEventListener("focus", maybeReload);
  setInterval(function () { if (shownDay && localISO(new Date()) !== shownDay) load(); }, 60000);

  // Text size, four steps, remembered on this phone
  var SIZES = [1, 1.25, 1.5, 1.8];
  var step = 0;
  try { step = Math.max(0, Math.min(SIZES.length - 1, parseInt(localStorage.getItem("klarity-size") || "0", 10) || 0)); } catch (e) {}
  function applySize() {
    document.documentElement.style.setProperty("--scale", String(SIZES[step]));
    el("smaller").disabled = step === 0;
    el("bigger").disabled = step === SIZES.length - 1;
    try { localStorage.setItem("klarity-size", String(step)); } catch (e) {}
  }
  applySize();
  el("bigger").addEventListener("click", function () { if (step < SIZES.length - 1) { step++; applySize(); } });
  el("smaller").addEventListener("click", function () { if (step > 0) { step--; applySize(); } });

  // Read aloud: plays the recorded natural voice for the day; uses the phone's voice only if no recording exists
  var synth = window.speechSynthesis;
  var player = new Audio();
  player.preload = "none";
  var playing = false;
  function idle() { playing = false; el("read").textContent = W().read; }
  player.addEventListener("ended", idle);
  function phoneVoice() {
    if (!(synth && typeof SpeechSynthesisUtterance !== "undefined")) { idle(); return; }
    var c = txt(current);
    var u = new SpeechSynthesisUtterance(c.focus + ". " + c.message + (c.practice ? " " + W().tryLabel + ". " + c.practice : ""));
    u.lang = W().speech; u.rate = 0.9;
    u.onend = u.onerror = idle;
    synth.speak(u);
  }
  el("read").addEventListener("click", function () {
    if (!current) return;
    if (playing) { player.pause(); player.currentTime = 0; if (synth) synth.cancel(); idle(); return; }
    playing = true; el("read").textContent = W().stop;
    // English recording is audio/DATE.mp3, Spanish is audio/DATE-es.mp3; the phone's voice is used if there is no recording
    player.src = "audio/" + current.date + (lang === "es" && current.es ? "-es" : "") + ".mp3";
    player.onerror = function () { if (playing) phoneVoice(); };
    var pr = player.play();
    if (pr && pr.catch) pr.catch(function () { if (playing) phoneVoice(); });
  });

  // How to install, shown only in the browser (not once installed)
  var standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
  if (!standalone) {
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    el("install").hidden = false;
  }

  function applyLang() {
    var w = W();
    document.documentElement.lang = lang === "es" ? "es-MX" : "en";
    el("tryLabel").textContent = w.tryLabel;
    el("pastLabel").textContent = w.past;
    el("lang").textContent = w.other;
    el("lang").lang = w.otherLang;
    el("install").querySelector("strong").textContent = w.install;
    el("installText").textContent = /iphone|ipad|ipod/i.test(navigator.userAgent) ? w.ios : w.android;
    if (!playing) el("read").textContent = w.read;
    if (all) render(all);
  }
  el("lang").addEventListener("click", function () {
    if (playing) { player.pause(); player.currentTime = 0; if (synth) synth.cancel(); idle(); }
    lang = lang === "es" ? "en" : "es";
    try { localStorage.setItem("klarity-lang", lang); } catch (e) {}
    applyLang();
  });
  applyLang();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) { reg.update(); }).catch(function () {});
    });
    var hadController = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (hadController && !reloaded) { reloaded = true; location.reload(); }
    });
  }
})();
</script>
</body>
</html>
